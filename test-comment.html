<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>コメントテストページ</title>
  <link rel="stylesheet" href="assets/test-comment.css">
</head>
<body data-comments-api="https://byemtnkogihshrkzhjjg.supabase.co/functions/v1/super-handler">
  <main>
    <h1>コメント投稿テスト</h1>
    <p>このページから Edge Function にコメントを送信します。`data-comments-api` を実際の URL に書き換えてください。</p>

    <form id="commentForm">
      <label>名前 <input id="name" type="text" placeholder="名前"></label>
      <label>コメント <textarea id="text" placeholder="コメント"></textarea></label>
      <label><input id="useShort" type="checkbox"> SHORT_CIRCUIT ヘッダを付ける（デバッグ用）</label>
      <button type="submit">投稿</button>
    </form>

    <pre id="result" style="white-space:pre-wrap"></pre>
  </main>
  <script src="assets/test-comment.js"></script>
</body>
</html>
