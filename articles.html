<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>記事一覧｜ランキングデータベース</title>
  <meta name="description" content="ランキングデータベースの記事を五十音順に掲載しています。">
  <link rel="stylesheet" href="assets/style.css">
</head>
